# Một bản phát hành vX.Y.Z (#263, docs/release.md), chạy từ GitHub Release
# do release-please.yml tạo:
#
# - image aegis-server và aegis-sandbox-<profile> lên GHCR cho linux/amd64
#   và linux/arm64 (#405), tag X.Y.Z và X.Y, ký bằng cosign keyless (OIDC
#   của GitHub, không có khóa);
# - gói offline cho mỗi kiến trúc: mỗi image một file `docker save`, kèm
#   SHA-256, versions-<arch>.txt (digest, migration cuối) và load-images.sh,
#   gắn vào Release;
# - client aegis cho bốn nền tảng, gắn vào Release, và một gói npm
#   chứa cả bốn binary, publish bằng OIDC trusted publishing (không có
#   token npm), như komainu.
#
# Chạy lại một bản: workflow_dispatch với tag đã có.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag đã có, vX.Y.Z'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  IMAGES: ghcr.io/${{ github.repository_owner }}
  CARGO_TERM_COLOR: always
  # The client has no query macros; this keeps sqlx's from asking for a
  # database anywhere in the build.
  SQLX_OFFLINE: 'true'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      minor: ${{ steps.check.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: check
        name: Tag khớp version trong repo
        run: |
          version=${TAG#v}
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          npm=$(python3 -c 'import json; print(json.load(open("npm/aegis/package.json"))["version"])')
          file=$(cat version.txt)
          echo "tag $version, Cargo.toml $cargo, package.json $npm, version.txt $file"
          for v in "$cargo" "$npm" "$file"; do
            [ "$v" = "$version" ] || { echo "::error::tag $TAG không khớp version trong repo"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.name }} (${{ matrix.arch }})
    needs: version
    # Each architecture builds on its own machine, not under QEMU: the
    # server compiles Rust and the sandboxes install toolchains (#405).
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [server, sandbox-python, sandbox-rust, sandbox-node, sandbox-java, sandbox-go, sandbox-dotnet]
        arch: [amd64, arm64]
        include:
          - { name: server, context: ., file: docker/server/Dockerfile }
          - { name: sandbox-python, context: docker/python, file: docker/python/Dockerfile }
          - { name: sandbox-rust, context: docker/rust, file: docker/rust/Dockerfile }
          - { name: sandbox-node, context: docker/node, file: docker/node/Dockerfile }
          - { name: sandbox-java, context: docker/java, file: docker/java/Dockerfile }
          - { name: sandbox-go, context: docker/go, file: docker/go/Dockerfile }
          - { name: sandbox-dotnet, context: docker/dotnet, file: docker/dotnet/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only; the manifests job puts both architectures
      # under the version tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGES }}/aegis-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}-${{ matrix.arch }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: manifest ${{ matrix.name }}
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [server, sandbox-python, sandbox-rust, sandbox-node, sandbox-java, sandbox-go, sandbox-dotnet]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag X.Y.Z và X.Y cho cả amd64 và arm64
        id: index
        env:
          IMAGE: ${{ env.IMAGES }}/aegis-${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
        run: |
          sources=()
          for file in digests/*; do sources+=("$IMAGE@sha256:${file#digests/}"); done
          [ ${#sources[@]} = 2 ] || { echo "::error::cần đúng hai digest: ${sources[*]}"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      # --recursive signs the index and each architecture's image, so a
      # check by either digest passes.
      - name: Ký image
        env:
          IMAGE: ${{ env.IMAGES }}/aegis-${{ matrix.name }}@${{ steps.index.outputs.digest }}
        run: |
          cosign sign --yes --recursive "$IMAGE"
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  offline:
    name: gói offline (${{ matrix.arch }})
    needs: [version, manifests]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Chỗ trống trên đĩa
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: scripts/release/save-images.sh "${{ needs.version.outputs.version }}" "$IMAGES" offline
      # Both legs write load-images.sh; amd64 attaches it.
      - name: Gắn vào Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          files=(offline/*-"$ARCH".*)
          [ "$ARCH" = amd64 ] && files+=(offline/load-images.sh)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  client:
    name: client (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-15-intel, npm: darwin-x64 }
          # 22.04: the binary runs on glibc 2.35 and later.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, npm: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, npm: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p aegis-client --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          name="aegis-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$name" "npm/${{ matrix.npm }}"
          cp "target/${{ matrix.target }}/release/aegis" docs/client.md "$name/"
          cp "target/${{ matrix.target }}/release/aegis" "npm/${{ matrix.npm }}/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.npm }}
          path: |
            aegis-*.tar.gz*
            npm/

  publish-client:
    name: client lên Release và npm
    needs: [version, client]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - name: Gói npm với bốn binary
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            install -D -m 0755 "dist/npm/$platform/aegis" "npm/aegis/vendor/$platform/aegis"
          done
          cp LICENSE npm/aegis/
          node npm/aegis/bin/aegis.js --help > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: npm có trusted publishing
        run: npm install -g npm@11.5.1
      - name: Gắn client vào Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd npm/aegis && npm pack --pack-destination ../../dist)
          gh release upload "$TAG" dist/aegis-*.tar.gz* dist/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish lên npmjs bằng OIDC
        working-directory: npm/aegis
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "@hoanghainh/aegis@${VERSION}" version >/dev/null 2>&1; then
            echo "@hoanghainh/aegis@${VERSION} đã có trên npmjs, bỏ qua bước publish."
          else
            npm publish --access public
          fi
