name: aegis-job release

# Binaries of the developer client (ADR 0006, #231), on a tag
# `aegis-job-v<version>`: built per platform, packed with their SHA-256 and
# put on the tag's GitHub Release.

on:
  push:
    tags: ['aegis-job-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag aegis-job-v<version>'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The client has no query macros; this keeps sqlx's from asking for a
  # database anywhere in the build.
  SQLX_OFFLINE: 'true'

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p aegis-client --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=${TAG#aegis-job-v}
          name="aegis-job-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/aegis-job" docs/client.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-job-${{ matrix.target }}
          path: aegis-job-*.tar.gz*

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aegis-job-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
                 --notes "aegis-job ${TAG#aegis-job-v}: see docs/client.md."
          gh release upload "$TAG" aegis-job-*.tar.gz* --repo "$GITHUB_REPOSITORY" --clobber
