name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: check-changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**.md'
              - '!docs/**'

  fmt:
    name: fmt
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.code != 'true'
        run: echo "Skipping fmt for documentation-only changes"

  clippy:
    name: clippy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.code == 'true'
        name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: needs.changes.outputs.code == 'true'
        name: clippy (aegis-provider, bedrock)
        run: cargo clippy -p aegis-provider --all-targets --features bedrock -- -D warnings
      - if: needs.changes.outputs.code != 'true'
        run: echo "Skipping clippy for documentation-only changes"

  test:
    name: test
    needs: changes
    runs-on: ubuntu-latest
    env:
      AEGIS_REQUIRE_PROFILE_TOOLS: "1"
      AEGIS_TEST_DATABASE_URL: postgres://postgres:aegis@localhost:5432/postgres
      AEGIS_REQUIRE_POSTGRES: "1"
    services:
      # aegis-store's tests and those that run an issue on it (#22).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: needs.changes.outputs.code == 'true'
        name: Python profile tools
        run: python -m pip install ruff==0.17.1 pytest==9.1.1 pytest-cov==7.1.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: needs.changes.outputs.code == 'true'
        name: Maven
        run: mvn -v || (sudo apt-get update && sudo apt-get install -y maven)
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.code == 'true'
        name: test (workspace)
        run: cargo test --workspace
      - if: needs.changes.outputs.code == 'true'
        name: test (aegis-provider, bedrock)
        run: cargo test -p aegis-provider --features bedrock
      - if: needs.changes.outputs.code != 'true'
        run: echo "Skipping test for documentation-only changes"

  sqlx:
    name: sqlx-prepare
    needs: changes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:aegis@localhost:5432/aegis
    services:
      # aegis-store's tests and those that run an issue on it (#22).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.code == 'true'
        name: sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      # The committed `.sqlx/` must match the queries and the migrations.
      - if: needs.changes.outputs.code == 'true'
        name: cargo sqlx prepare --check
        run: |
          cargo sqlx database create
          cargo sqlx migrate run --source crates/aegis-store/migrations
          cargo sqlx prepare --workspace --check
      - if: needs.changes.outputs.code != 'true'
        run: echo "Skipping sqlx for documentation-only changes"

  deny:
    name: deny
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # The gate's policy for target repos, run on this tree to show it is
      # valid. Advisories are left to the step above: aegis's own exceptions
      # (deny.toml) must not be copied into the targets' policy.
      - if: needs.changes.outputs.code == 'true'
        name: policies/deny.toml is valid
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --config policies/deny.toml
          command: check bans licenses sources
      - if: needs.changes.outputs.code != 'true'
        run: echo "Skipping deny for documentation-only changes"

  coverage:
    name: coverage
    needs: changes
    runs-on: ubuntu-latest
    env:
      AEGIS_REQUIRE_PROFILE_TOOLS: "1"
      AEGIS_TEST_DATABASE_URL: postgres://postgres:aegis@localhost:5432/postgres
      AEGIS_REQUIRE_POSTGRES: "1"
    services:
      # aegis-store's tests and those that run an issue on it (#22).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: needs.changes.outputs.code == 'true'
        name: Python profile tools
        run: python -m pip install ruff==0.17.1 pytest==9.1.1 pytest-cov==7.1.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: needs.changes.outputs.code == 'true'
        name: Maven
        run: mvn -v || (sudo apt-get update && sudo apt-get install -y maven)
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - if: needs.changes.outputs.code == 'true'
        name: coverage (workspace, all features)
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80 --lcov --output-path lcov.info
      - if: needs.changes.outputs.code == 'true'
        name: coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
      - if: needs.changes.outputs.code != 'true'
        run: echo "Skipping coverage for documentation-only changes"
