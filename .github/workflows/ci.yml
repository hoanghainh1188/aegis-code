name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (aegis-provider, bedrock)
        run: cargo clippy -p aegis-provider --all-targets --features bedrock -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Fixture tests of the language profiles must run, not skip.
      AEGIS_REQUIRE_PROFILE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      # aegis-lang's fixture test runs the Rust profile's gate (rustfmt, clippy).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python profile tools
        run: python -m pip install ruff==0.17.1 pytest==9.1.1 pytest-cov==7.1.0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Node 24 runs the TypeScript fixture's tests without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Maven
        run: mvn -v || (sudo apt-get update && sudo apt-get install -y maven)
      - uses: Swatinem/rust-cache@v2
      - name: test (workspace)
        run: cargo test --workspace
      - name: test (aegis-provider, bedrock)
        run: cargo test -p aegis-provider --features bedrock

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny.toml đặt `all-features = true`, nên một lượt đã gồm cả feature bedrock.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # Policy the gate applies to target repos (#12): keep it loadable.
      - name: policies/deny.toml is valid
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --config policies/deny.toml
          command: check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      AEGIS_REQUIRE_PROFILE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python profile tools
        run: python -m pip install ruff==0.17.1 pytest==9.1.1 pytest-cov==7.1.0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Node 24 runs the TypeScript fixture's tests without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Maven
        run: mvn -v || (sudo apt-get update && sudo apt-get install -y maven)
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: coverage (workspace, all features)
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80 --lcov --output-path lcov.info
      - name: coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info
