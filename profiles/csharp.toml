# Language profile C# / .NET (ADR 0004, #70). Lệnh là mảng argv, không qua
# shell. Gate chạy không mạng nên mọi lệnh sau `dotnet restore` có
# `--no-restore`.
# Placeholder: `{file}` ở edit.format, `{test}` ở gate.repro_test (biểu thức
# `--filter` của `dotnet test`, ví dụ FullyQualifiedName~CartTests.Adds),
# `{lockfile}` / `{licenses}` / `{osv_config}` ở audit.
# RepoConfig ghi đè từng lệnh bằng lệnh CI của chính repo.
#
# Sonar với .NET khác các profile khác: SonarScanner for .NET chạy quanh bước
# build (`begin` → `dotnet build` → `end`), gate gộp bước Sonar vào build (#11).

language = "csharp"
display_name = "C# / .NET"

[detect]
markers = ["*.sln", "*.slnx", "*.csproj", "Directory.Build.props", "global.json"]
extensions = ["cs"]

[aci]
lsp = ["csharp-ls"]

[edit]
format = ["dotnet", "format", "whitespace", "--folder", "--include", "{file}"]

[gate]
format = ["dotnet", "format", "--verify-no-changes", "--no-restore"]
# Cảnh báo của Roslyn analyzers là lỗi.
lint = ["dotnet", "build", "--no-restore", "-warnaserror"]
repro_test = ["dotnet", "test", "--no-restore", "--filter", "{test}"]
# `--filter` không khớp test nào thì VSTest báo "No test matches" và trả 0;
# khi có chạy, VSTest in `Total: <n>`, Microsoft.Testing.Platform in
# `total: <n>` (#235).
repro_ran = '(?i)\btotal(\s+tests)?:\s*[1-9]'
test = ["dotnet", "test", "--no-restore"]
# `Failed <name> [<time>]` của VSTest, `failed <name> (<time>)` của
# Microsoft.Testing.Platform (#291).
test_output = "dotnet"
coverage = [
    "dotnet", "test", "--no-restore",
    "--results-directory", "TestResults",
    "--collect", "XPlat Code Coverage;Format=opencover",
]
# `--collect` là tùy chọn của VSTest. Repo chạy test bằng
# Microsoft.Testing.Platform (global.json `"test": {"runner": …}`) không nhận
# nó, và coverage ở đó đi qua extension mà repo tự tham chiếu
# (Microsoft.Testing.Extensions.CodeCoverage, coverlet.MTP), nên gate bỏ qua
# bước này. Repo có coverage thì khai `[gate] coverage` cùng `[coverage]`
# trong RepoConfig (#228).
coverage_skip = [
    { file = "global.json", pattern = '"runner"\s*:\s*"Microsoft\.Testing\.Platform"' },
]

# SonarQube C# không đọc Cobertura; coverlet xuất OpenCover vào một thư mục
# GUID, nên đường dẫn có `*`.
[coverage]
format = "open_cover"
path = "TestResults/*/coverage.opencover.xml"

[dependencies]
manifests = ["*.csproj", "*.fsproj", "*.vbproj", "*.proj", "*.props", "*.targets", "nuget.config", "global.json", "dotnet-tools.json"]
# packages.lock.json khi repo bật RestorePackagesWithLockFile; không thì
# PackageReference trong mọi file MSBuild (cây đã resolve là #80).
# nuget.config cho biết package lấy từ đâu; global.json và dotnet-tools.json
# cho SDK và tool tải từ NuGet. Tên file so không phân biệt hoa thường.
lockfiles = ["packages.lock.json", "*.csproj", "*.fsproj", "*.vbproj", "*.proj", "*.props", "*.targets", "nuget.config", "global.json", "dotnet-tools.json"]
official_source = "https://api.nuget.org/v3/index.json"
fetch = ["dotnet", "restore"]
# Registry hosts the fetch container may reach (#66, #279): the feed and
# its packages. The signature checks' revocation lookups (plain http to the
# CAs) are refused; restore goes on without them.
fetch_hosts = ["api.nuget.org"]
# `dotnet restore` ghi `obj/project.assets.json` vào từng project. Bản sao
# nhánh gốc không có thì `dotnet test --no-restore` ở đó không chạy test nào
# mà vẫn trả 0, nên gate chạy restore cả ở đó (#303). Gói đã có trong
# `~/.nuget/packages` nên lần này không tải lại.
fetch_base = true
audit = ["osv-scanner", "scan", "source", "--lockfile", "{lockfile}", "--licenses={licenses}", "--config={osv_config}"]
# OSV advisories and deps.dev license data; nothing else (#159).
audit_hosts = ["api.osv.dev", "api.deps.dev"]
# Bản vá chạm vào là bị chặn (#83): response file thêm tham số MSBuild.
protected = ["Directory.Build.rsp", "*.rsp"]

[sandbox]
image = "aegis-sandbox-dotnet"
# `artifacts`: MSBuild's artifacts output (`UseArtifactsOutput`, .NET 8) puts
# every project's bin and obj there (#290).
cache_dirs = ["bin", "obj", "artifacts", "/home/aegis/.nuget/packages"]

# Gate gộp Sonar vào build: `dotnet sonarscanner begin` → lệnh này → `end`.
# Build chạy trong sandbox không mạng như các bước khác; chỉ begin/end có
# mạng và token (#91). Image cần `dotnet-sonarscanner` trên PATH.
[sonar]
scanner = "dotnet"
build = ["dotnet", "build", "--no-restore"]

[sonar.properties]
"sonar.cs.opencover.reportsPaths" = "TestResults/*/coverage.opencover.xml"

[prompt]
conventions = "csharp.md"
