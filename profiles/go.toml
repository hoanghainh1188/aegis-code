# Language profile Go (ADR 0004, #69). Lệnh là mảng argv, không qua shell.
# Placeholder: `{file}` ở edit.format, `{test}` ở gate.repro_test (regex
# của `go test -run`), `{lockfile}` / `{licenses}` / `{osv_config}` ở
# dependencies.audit.
# RepoConfig ghi đè từng lệnh bằng lệnh CI của chính repo.

language = "go"
display_name = "Go"

[detect]
markers = ["go.mod"]
extensions = ["go"]

[aci]
lsp = ["gopls"]

[edit]
format = ["gofmt", "-w", "{file}"]

[gate]
# `gofmt -l` luôn trả 0; `-d` trả 1 khi có khác biệt.
format = ["gofmt", "-d", "."]
lint = ["go", "vet", "./..."]
repro_test = ["go", "test", "./...", "-run", "{test}"]
# `-run` khớp không test nào thì mọi package in `ok … [no tests to run]` và
# trả 0; package có chạy test in `ok <package> <thời gian>` (#235).
repro_ran = '(?m)^ok\s+\S+\s+(\d+(\.\d+)?s|\(cached\))\s*$'
test = ["go", "test", "./..."]
# `--- FAIL: <test>` rồi `FAIL <package>`: gate so test fail với nhánh gốc (#291).
test_output = "go_test"
coverage = ["go", "test", "./...", "-coverprofile=coverage.out"]

[coverage]
format = "go_coverprofile"
path = "coverage.out"

[dependencies]
# Go không có lockfile riêng: go.mod liệt kê mọi module (từ Go 1.17),
# go.sum chỉ giữ hash. Bộ đọc lấy go.mod, có tính `replace`.
manifests = ["go.mod"]
lockfiles = ["go.mod", "go.sum"]
official_source = "proxy.golang.org"
fetch = ["go", "mod", "download"]
# Registry hosts the fetch container may reach (#66, #279): the module
# proxy, and the checksum database for a module go.sum does not list yet.
fetch_hosts = ["proxy.golang.org", "sum.golang.org"]
audit = ["osv-scanner", "scan", "source", "--lockfile", "{lockfile}", "--licenses={licenses}", "--config={osv_config}"]
# OSV advisories and deps.dev license data; nothing else (#159).
audit_hosts = ["api.osv.dev", "api.deps.dev"]
# Bản vá chạm vào là bị chặn (#83): go.work ghi đè replace của go.mod;
# vendor/ được build thay cho module tải về, không kiểm hash.
protected = [
    "go.work",
    "go.work.sum",
    "vendor/**",
]

[sandbox]
image = "aegis-sandbox-go"
# Chỉ cache module: gate mount cache ngoài cây ở chế độ chỉ đọc, mà `go`
# phải ghi vào build cache (GOCACHE), nên mỗi container có build cache riêng
# của nó (#210).
cache_dirs = ["/go/pkg/mod"]

[sonar.properties]
"sonar.go.coverage.reportPaths" = "coverage.out"

[prompt]
conventions = "go.md"
