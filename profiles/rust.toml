# Language profile Rust (ADR 0004, #63, #64). Lệnh là mảng argv, không qua
# shell. Placeholder: `{file}` ở edit.format, `{test}` ở gate.repro_test,
# `{lockfile_dir}` / `{deny_config}` ở dependencies.audit.
# RepoConfig ghi đè từng lệnh bằng lệnh CI của chính repo.

language = "rust"
display_name = "Rust"

[detect]
markers = ["Cargo.toml"]
extensions = ["rs"]

[aci]
lsp = ["rust-analyzer"]

# rust-analyzer không chạy `cargo check` mỗi lần lưu (đó là việc của gate, và
# trên repo lớn nó build cả workspace), và build script / proc macro của nó
# vào `target/rust-analyzer`, không tranh khoá `target/` với gate (#89).
[aci.lsp_options]
checkOnSave = false

[aci.lsp_options.cargo]
targetDir = true

[edit]
# Chỉ format file vừa sửa. Edition mặc định 2021; repo khác edition thì ghi đè.
# Qua stdin: rustfmt nhận đường dẫn thì format luôn các file `mod` con mà file
# đó khai báo; đọc stdin thì chỉ format nội dung đưa vào (#88). rustfmt.toml
# vẫn được đọc từ thư mục gốc repo.
format = ["rustfmt", "--edition", "2021", "--emit", "stdout"]
stdin = true

[gate]
format = ["cargo", "fmt", "--all", "--check"]
lint = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
repro_test = ["cargo", "test", "--workspace", "--", "--exact", "{test}"]
test = ["cargo", "test", "--workspace", "--no-fail-fast"]
test_output = "libtest"
# --ignore-run-fail: the report is written even when a test fails; the test
# step has judged the failures against the base already (#104).
coverage = ["cargo", "llvm-cov", "--workspace", "--ignore-run-fail", "--lcov", "--output-path", "lcov.info"]

[coverage]
format = "lcov"
path = "lcov.info"

[dependencies]
manifests = ["Cargo.toml"]
lockfiles = ["Cargo.lock"]
official_source = "registry+https://github.com/rust-lang/crates.io-index"
fetch = ["cargo", "fetch", "--locked"]
# Registry hosts the fetch container may reach (#66). Git dependencies need
# their host added by the repo (`fetch_hosts` in RepoConfig).
fetch_hosts = ["crates.io", "index.crates.io", "static.crates.io"]
# Bản vá chạm vào là bị chặn (#83): source replacement trong .cargo/config
# không hiện trong Cargo.lock; toolchain file đổi compiler được tải về.
protected = [
    "**/.cargo/config.toml",
    "**/.cargo/config",
    "rust-toolchain",
    "rust-toolchain.toml",
]
# Advisory + license bằng `cargo deny` (#12, #159): {deny_config} là
# policies/deny.toml với `licenses` và `ignored_advisories` của repo.
audit = ["cargo", "deny", "--locked", "--manifest-path", "{lockfile_dir}/Cargo.toml", "--config", "{deny_config}", "check"]
# advisory-db (git trên github.com) và index để `cargo metadata` đọc.
audit_hosts = ["github.com", "index.crates.io", "static.crates.io"]

[sandbox]
image = "aegis-sandbox-rust"
cache_dirs = ["target", "/usr/local/cargo/registry", "/usr/local/cargo/git"]

# SonarQube tự chạy `cargo clippy` (tắt bằng sonar.rust.clippy.enabled = false);
# chỉ cần trỏ tới report coverage. Nguồn: docs SonarQube Server 2026.4,
# "Rust" và "Test coverage parameters".
[sonar.properties]
"sonar.rust.lcov.reportPaths" = "lcov.info"

[prompt]
conventions = "rust.md"
