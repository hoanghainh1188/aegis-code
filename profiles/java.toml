# Language profile Java (ADR 0004, #68). Lệnh là mảng argv, không qua shell.
# Mặc định cho Maven; repo dùng Gradle hay có formatter/linter riêng
# (Spotless, Checkstyle…) thì ghi đè trong RepoConfig.
# Placeholder: `{test}` ở gate.repro_test (`Class#method` của surefire),
# `{lockfile}` / `{licenses}` / `{osv_config}` ở audit.
#
# Gate chạy không mạng nên mọi lệnh Maven có `-o`. Bước lấy phụ thuộc chạy
# pha `test` để surefire tải provider (dependency:go-offline không tải), với
# bộ lọc tên method không khớp test nào (#288). Không dùng `-Dgroups`: có nó
# surefire chọn provider JUnit 4.7 cho repo JUnit 4, còn gate cần provider
# JUnit 4. Bộ lọc theo tên lớp cũng không được: không lớp nào khớp thì
# surefire dừng trước khi tải provider. Suite dựng bằng `suite()` (JUnit 3,
# `@RunWith(AllTests.class)`) không lọc theo method được nên vẫn chạy ở đây,
# cùng quyền với các plugin build mà pha `test` vốn đã chạy.

language = "java"
display_name = "Java"

[detect]
markers = ["pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]
extensions = ["java"]

[aci]
lsp = ["jdtls"]

# Không có formatter chung cho Java; repo có Spotless thì ghi đè edit_format
# và gate.format (ví dụ `mvn -o spotless:apply` / `spotless:check`).
[edit]

[gate]
# Lỗi biên dịch, kể cả test, chặn bản vá ngay.
lint = ["mvn", "-B", "-o", "-q", "test-compile"]
repro_test = ["mvn", "-B", "-o", "-q", "test", "-Dtest={test}"]
# `--fail-at-end`: test của một module fail sẵn ở nhánh gốc không chặn test
# của các module khác (module phụ thuộc nó vẫn bị bỏ qua). Gate đọc dòng
# `<Class>.<method> -- Time elapsed … <<< FAILURE!` của Surefire (#291).
test = ["mvn", "-B", "-o", "-q", "--fail-at-end", "test"]
test_output = "surefire"
coverage = [
    "mvn", "-B", "-o", "-q",
    "org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent",
    "test",
    "org.jacoco:jacoco-maven-plugin:0.8.12:report",
]

[coverage]
format = "jacoco"
path = "target/site/jacoco/jacoco.xml"

[dependencies]
# libs.versions.toml: version catalog của Gradle, đổi phiên bản mà không chạm
# build script.
manifests = ["pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts", "gradle.properties", "*.versions.toml"]
# Maven không có lockfile: pom.xml cho phụ thuộc khai báo trực tiếp,
# [dependencies.tree] cho phụ thuộc bắc cầu.
lockfiles = ["pom.xml", "extensions.xml", "gradle.lockfile", "buildscript-gradle.lockfile"]
official_source = "https://repo.maven.apache.org/maven2"
fetch = [
    "mvn", "-B", "-q",
    "dependency:go-offline",
    "org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent",
    "test",
    "org.jacoco:jacoco-maven-plugin:0.8.12:report",
    "-Dtest=#aegisFetchOnly",
    "-Dsurefire.failIfNoSpecifiedTests=false",
    "-DfailIfNoTests=false",
]
# Registry hosts the fetch container may reach (#66, #279): plugins and
# dependencies both come from Maven Central. Maven reads the proxy from the
# settings the image's `mvn` writes (docker/java/mvn).
fetch_hosts = ["repo.maven.apache.org"]
audit = ["osv-scanner", "scan", "source", "--lockfile", "{lockfile}", "--licenses={licenses}", "--config={osv_config}"]
# OSV advisories and deps.dev license data; nothing else (#159).
audit_hosts = ["api.osv.dev", "api.deps.dev"]
# Bản vá chạm vào là bị chặn (#83): cấu hình Maven ngoài pom (thêm -D, -s
# settings.xml, mirror), build script và wrapper của Gradle, không đọc được.
protected = [
    "**/.mvn/maven.config",
    "**/.mvn/jvm.config",
    "**/.mvn/wrapper/**",
    "settings.xml",
    "mvnw",
    "mvnw.cmd",
    "build.gradle",
    "build.gradle.kts",
    "settings.gradle",
    "settings.gradle.kts",
    "gradle.properties",
    "*.init.gradle",
    "init.gradle",
    "**/gradle/wrapper/**",
    "gradlew",
    "gradlew.bat",
]

# Cây phụ thuộc đã resolve (#80), vì pom.xml không cho thấy phụ thuộc bắc
# cầu. Gate chạy lệnh trong container lấy phụ thuộc, qua proxy, cho nhánh
# chính và cho bản vá, rồi so như lockfile trước khi fetch.
# dependency:tree chỉ tải pom, không tải jar của phụ thuộc. `{output}` là file
# ngoài cây repo; appendOutput gộp cây của mọi module.
# Repo Gradle không bật locking ghi đè `tree` trong RepoConfig, liệt kê từng
# project (`gradle dependencies` chỉ in một project):
#   [tree]
#   file = "gradle-dependencies.txt"
#   command = ["sh", "-c", "gradle -q dependencies :core:dependencies > {output}"]
#   on_change = ["*.versions.toml", "gradle.properties", "gradle.lockfile"]
# Repo Gradle đã lock mọi phụ thuộc thì đặt `tree = false`.
[dependencies.tree]
file = "maven-dependency-tree.txt"
command = [
    "mvn", "-B", "-q",
    "org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree",
    "-DoutputFile={output}",
    "-DappendOutput=true",
]
on_change = ["pom.xml", "extensions.xml"]

[sandbox]
image = "aegis-sandbox-java"
cache_dirs = ["target", "/home/aegis/.m2/repository", "/home/aegis/.gradle/caches"]
# Ngoài các thư mục trên, image chỉ đọc (#320); Maven và Gradle ghi vào HOME.
writable = ["/home/aegis"]

[sonar.properties]
"sonar.coverage.jacoco.xmlReportPaths" = "target/site/jacoco/jacoco.xml"

[prompt]
conventions = "java.md"
