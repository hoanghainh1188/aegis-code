# Language profile Python (ADR 0004, #63, #65). Lệnh là mảng argv, không qua
# shell. Placeholder: `{file}` ở edit.format, `{test}` ở gate.repro_test.
# RepoConfig ghi đè từng lệnh bằng lệnh CI của chính repo.

language = "python"
display_name = "Python"

[detect]
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt"]
extensions = ["py", "pyi"]

[aci]
lsp = ["basedpyright-langserver", "--stdio"]

[edit]
format = ["ruff", "format", "{file}"]

[gate]
format = ["ruff", "format", "--check", "."]
lint = ["ruff", "check", "."]
repro_test = ["python", "-m", "pytest", "{test}"]
test = ["python", "-m", "pytest"]
test_output = "pytest"
coverage = ["python", "-m", "pytest", "--cov", "--cov-report=xml:coverage.xml"]

[coverage]
format = "cobertura"
path = "coverage.xml"

[dependencies]
manifests = ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt"]
lockfiles = ["uv.lock", "poetry.lock", "requirements*.txt"]
official_source = "https://pypi.org/simple"
fetch = ["uv", "sync", "--frozen"]
# Registry hosts the fetch container may reach (#66); the venv is kept for
# the gate, read-only.
fetch_hosts = ["pypi.org", "files.pythonhosted.org"]
dirs = [".venv"]
# Advisory + license, cho mọi hệ sinh thái ngoài Rust (ADR 0004 §3, chốt ở #65).
# Cần mạng (dữ liệu license từ deps.dev) nên chạy cùng bước lấy phụ thuộc (#66).
# {licenses} là `licenses` của repo, mặc định policies/licenses.toml;
# {osv_config} bỏ qua `ignored_advisories` của repo (#159).
audit = ["osv-scanner", "scan", "source", "--lockfile", "{lockfile}", "--licenses={licenses}", "--config={osv_config}"]
# OSV advisories and deps.dev license data; nothing else (#159).
audit_hosts = ["api.osv.dev", "api.deps.dev"]
# Bản vá chạm vào là bị chặn (#83): đổi index mà lockfile không thấy.
protected = [
    "pip.conf",
    "uv.toml",
]

[sandbox]
image = "aegis-sandbox-python"
cache_dirs = [".venv", "/home/aegis/.cache/uv"]

[sonar.properties]
"sonar.python.coverage.reportPaths" = "coverage.xml"

[prompt]
conventions = "python.md"
