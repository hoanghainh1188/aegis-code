body = "Tajik (`tg`) — the state language of Tajikistan, written in Cyrillic — is missing from the 63 locales. Its neighbours are all there (`uz`, `az`, `ka`, `hy`, `be`, `uk`, `fa`), so the gap stands out for Central Asian apps.\n\nThe locale is written and ready on a branch:\n\n**https://github.com/ismoil77/zod/tree/add-tajik-locale** — single commit [`c62a083`](https://github.com/ismoil77/zod/commit/c62a083), 5 files.\n\nI'm opening this as an issue rather than a PR because the interaction limit blocks me from opening one — the same situation you described in #6473. Feel free to cherry-pick the commit the way you did there, or tell me if you'd rather I hand the file over some other way.\n\n### What's in it\n\n- `packages/zod/src/v4/locales/tg.ts`\n- `packages/zod/src/v4/locales/index.ts` — barrel export\n- `packages/zod/jsr.json` — subpath\n- `packages/docs/content/error-customization.mdx` — locale list\n- `packages/zod/src/v4/core/tests/locales/tg.test.ts` — 13 assertions, in the style of `uz.test.ts`\n\n### Sample output\n\n```\nz.number().safeParse(\"a\")                  Вуруди нодуруст: рақам интизор мерафт, сатр гирифта шуд\nz.enum([\"a\",\"b\"]).safeParse(1)             Интихоби нодуруст: яке аз \"a\"|\"b\" интизор мерафт\nz.number().max(10).safeParse(15)           Хеле калон: number бояд <=10 бошад\nz.string().min(5).safeParse(\"hi\")          Хеле хурд: string бояд >=5 аломат дошта бошад\nz.array(z.number()).min(2).safeParse([1])  Хеле хурд: array бояд >=2 унсур дошта бошад\nz.string().email().safeParse(\"nope\")       суроғаи email-и нодуруст\nz.string().startsWith(\"ab\")                Сатри нодуруст: бояд бо \"ab\" оғоз шавад\nz.number().multipleOf(5).safeParse(7)      Рақами нодуруст: бояд ба 5 бе бақия тақсим шавад\nz.strictObject({ a: z.string() })          Калиди номаълум: \"b\"  /  Калидҳои номаълум: \"b\", \"c\"\n```\n\n### Notes on the translation\n\n- Tajik keeps a noun in its singular form after a numeral, so unlike `ru` this locale needs no plural helper — the `Sizable` units (`аломат`, `байт`, `унсур`, `сабт`) are used as they are.\n- `FormatDictionary` covers every key `en` translates, so `locales/parity.test.ts` passes.\n- `TypeDictionary` translates the type names with an everyday Tajik equivalent (`рақам`, `сатр`, `массив`, `объект`, `сана`); the rest fall through to the raw name, as in the other locales.\n- An adjective follows its noun in Tajik, so an unknown format reads `суроғаи email-и нодуруст` (\"invalid email address\") rather than the English word order.\n\nThe wording matches the terminology of a Tajik product I maintain, where the same vocabulary is already in front of users.\n\n### Checks\n\nThe repo now builds with `nub`, which isn't on npm, so I ran the two relevant suites with vitest directly against the workspace sources: `locales/tg.test.ts` and `locales/parity.test.ts` both pass. `tsc --strict` is clean on the new file, and `biome check` (1.9.4, the pinned version) reports no issues on the touched files — it flagged one formatting nit, which is already fixed in the commit.\n"
