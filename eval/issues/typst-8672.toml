body = "### Description\n\nWhen exporting a document to SVG, a hyperlink URL containing an ampersand(`&`) may be written to the SVG without XML escaping.\n\n## Step to Reproduce\n\n1. write `references.bib` and `main.typ`\n```\n@online{aaaaa,\n  author  = {{bbbbb}},\n  title   = {ccccc},\n  url     = {https://example.com/files?page=1&status=active},\n}\n```\n\n```typst\n  Citation: @aaaaa\n\n...\n\n  #bibliography(\"references.bib\", title: \"references\", style: \"ieee\")\n```\n\n2. export to svg\n```bash\ntypst compile --format \"main.typ\" \"main.svg\"\n```\n\n3. Validate the generated SVG\n```bash\nxmllint --noout main.svg\n```\n\n## Actual behavior\n\nThe generated SVG contains an unescaped ampersand in an `xlink:href` attribute and is rejected by XML/SVG parsers with an error such as:\n```bash\nparser error: EntityRef: expecting ';'\n```\nIs also fails to render with resvg.\n\n## Expected behavior\n\nAmpersands in hyperlink attributes should be serialized as `&amd;` so that the generated SVG in well-formed XML while preserving the original URL.\n\n### Operating system\n\nLinux\n\n### Typst version\n\n- [x] I am using the latest version of Typst"

