body = "## Summary\n\n`getValue` grows the backtrack stack with a raw reslice `(*skippedNodes)[:index+1]`, assuming capacity equals `Engine.maxSections`. However, `skippedNodes` capacity is captured when the context pool allocates it. Routes registered after a context is already created raise `maxSections` without resizing the pooled slice. The next request needing an additional backtrack frame panics with:\n`runtime error: slice bounds out of range` inside the router before any middleware or handler.\n\n## Steps to Reproduce\n\n1. Register `GET /a` and serve a warmup request (pooled context capacity = 1).\n2. Register additional nested routes: `GET /x/y/z/w`, `GET /x/y/:id/w`, `GET /x/:id/z/w`, `GET /:id/y/z/w`.\n3. Serve `POST /x/y/z/w/extra` with `router.HandleMethodNotAllowed = true`.\n4. Result: `panic: runtime error: slice bounds out of range [:2] with capacity 1`.\n\n## Proposed Fix\n\nGrow `skippedNodes` with `append` instead of raw reslicing.\n\nA Pull Request addressing this is submitted concurrently."
