body = "## Summary\n\nThe `es`, `fr`, `he`, `hr` and `lt` locales have no `map` entry in their `Sizable` table. As a result, `z.map().min()/max()/size()` errors fall through to the generic comparison wording, without the unit, and in `lt` they end with `undefined`. The matching `set` messages in the same locales are correct.\n\n## Reproduction\n\n1. `npm i zod@4.6.6`\n2. Run with `node repro.mjs`:\n\n```js\nimport * as z from \"zod\";\nfor (const l of [\"en\", \"es\", \"fr\", \"he\", \"hr\", \"lt\"]) {\n  z.config(z.locales[l]());\n  const m = z.map(z.string(), z.number()).max(1).safeParse(new Map([[\"a\", 1], [\"b\", 2]])).error.issues[0].message;\n  const s = z.set(z.string()).max(1).safeParse(new Set([\"a\", \"b\"])).error.issues[0].message;\n  console.log(`${l} map: ${m}  |  set: ${s}`);\n}\n```\n\n3. The bug triggers on any `too_big` / `too_small` issue with `origin: \"map\"` under one of those five locales.\n\n## Actual behavior\n\n```\nen map: Too big: expected map to have <=1 entries  |  set: Too big: expected set to have <=1 items\nes map: Demasiado grande: se esperaba que mapa fuera <=1  |  set: Demasiado grande: se esperaba que conjunto tuviera <=1 elementos\nfr map: Trop grand : map doit être <=1  |  set: Trop grand : ensemble doit avoir <=1 éléments\nhe map: גדול מדי: המפה (Map) צריכה להיות <=1  |  set: גדול מדי: הקבוצה (Set) צריכה להכיל 1 פריטים או פחות\nhr map: Preveliko: očekivano da mapa bude <=1  |  set: Preveliko: očekivano da skup ima <=1 stavki\nlt map: Map turi būti ne didesnis kaip 1 undefined  |  set: Set turi turėti ne daugiau kaip 1 elementą\n```\n\n## Expected behavior\n\nMap size errors should state the unit (entries), the way `en` and the `set` messages in the same locales do, e.g. `se esperaba que mapa tuviera <=1 entradas`.\n\n## Environment\n\n- Version/commit: zod 4.6.6 (npm), also present on `main` at 284243fb\n- OS: Ubuntu Linux, Node v24.21.0\n- Relevant configuration: `z.config(z.locales.es())` (or `fr` / `he` / `hr` / `lt`)\n\n## Evidence\n\nI compared each locale's `Sizable` keys against `en.ts` (`string`, `file`, `array`, `set`, `map`). These five lack `map`, e.g. `packages/zod/src/v4/locales/es.ts:6-11`:\n\n```ts\nconst Sizable: Record<string, { unit: string; verb: string }> = {\n  string: { unit: \"caracteres\", verb: \"tener\" },\n  file: { unit: \"bytes\", verb: \"tener\" },\n  array: { unit: \"elementos\", verb: \"tener\" },\n  set: { unit: \"elementos\", verb: \"tener\" },\n};\n```\n\n## Additional context\n\n- Confirmed: the five locales and their output above. Every other locale has a `map` entry.\n- Root cause: `Sizable` is typed `Record<string, …>`, so a missing origin type-checks fine and falls back silently. Same class as #6424 (the `credit_card` key missing from seven locales). Suggestion, not tested: type it over the sized origins, e.g. `Record<\"string\" | \"file\" | \"array\" | \"set\" | \"map\", …>`, so the next missing key becomes a compile error.\n- The `lt` `undefined` suffix is a separate bug in its fallback branch (#6655). Adding `map` to `lt` hides it for maps only.\n- I found no existing issue or open PR for this.\n"

