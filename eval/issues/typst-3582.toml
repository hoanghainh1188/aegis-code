body = "### Description\n\nUnder certain circumstances, a footnote in the text after a heading can cause the pagebreak to be placed between the heading and the text. I think this behavior is wrong because without the footnote heading and text stay on the same page.\r\n\r\nCode to reproduce the issue:\r\n```typst\r\n#lorem(620)\r\n= Heading\r\n#lorem(10)\r\n#footnote[#lorem(10)].\r\n```\r\n![image](https://github.com/typst/typst/assets/20155974/6ca12431-01f5-439e-a2b0-d89565181485)\r\n\r\nExpected behavior is similar to what happens here, i.e., the heading appears on the next page together with the text.\r\n```typst\r\n#lorem(624)\r\n= Heading\r\n#lorem(20)\r\n```\r\n![image](https://github.com/typst/typst/assets/20155974/8c33f0c2-b9cb-4a75-80a5-92bfaab4fb7d)\r\n\r\n\r\n\n\n### Reproduction URL\n\n_No response_\n\n### Operating system\n\nWindows\n\n### Typst version\n\n- [X] I am using the latest version of Typst"

