body = "### Feature Description\n\n## Feature description\n\n`RouterGroup.Any` currently registers a fixed list of HTTP methods but excludes `QUERY`, even though Gin supports `router.QUERY` and `gin.MethodQuery` (RFC 10008). As a result, a `QUERY` request to an `Any` route returns 404.\n\n```go\nr := gin.New()\nr.Any(\"/search\", func(c *gin.Context) {\n    c.Status(http.StatusOK)\n})\n// QUERY /search currently returns 404.\n```\n\nI propose adding `gin.MethodQuery` to the methods registered by `Any`, then updating its documentation and routing tests. This would make `Any` cover every HTTP method that Gin exposes through a routing shortcut. Applications that want an explicit set of methods can continue using `Match`.\n\n## Compatibility consideration\n\nPR #4806 deliberately left `QUERY` out of `Any` to preserve the matching behavior of existing routes. Including it would change those routes to accept `QUERY`, so this should be treated as an intentional behavior change and called out in release notes. Handlers registered with `Any` would also need to respect QUERY's safe and idempotent semantics when processing that method.\n\nRelated: #4721 and #4806."

