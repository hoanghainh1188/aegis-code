body = "### Describe the bug\n\nWhen multiple callers concurrently initialize the same key in\nResiliencePipelineRegistry, multiple pipeline instances can be constructed,\nwhile only one instance is stored and returned.\n\nThe discarded instances do not appear to be disposed. Their disposal\ncallbacks are not invoked, and their reload registrations remain active\neven after the registry is disposed.\n\nThis reproduces with both generic and non-generic pipelines.\n\nRelated: #2539. Duplicate construction itself is expected. This report\nconcerns cleanup of the discarded instances.\n\n### Expected behavior\n\nEvery pipeline instance constructed by the registry should have its\nowned resources cleaned up when it is discarded or when the registry\nis disposed.\n\nIf eight instances are constructed and one is retained, the seven\ndiscarded instances should be cleaned up, and the retained instance\nshould be cleaned up during registry disposal.\n\nAfter registry disposal completes, cancelling a previously registered\nreload token should not trigger further pipeline construction.\n\n### Actual behavior\n\nWith eight synchronized callers requesting the same key:\n\n- Eight pipeline instances are constructed.\n- All callers receive the same retained instance.\n- After registry disposal, only one disposal callback has executed.\n- Cancelling the reload token afterward triggers seven additional builds.\n\nThe reproduction prints:\n\nNon-generic: built=8, distinct returned=1, disposed after registry shutdown=1\n  Builds triggered AFTER registry disposal by reload signal: 7; expected 0\n  Total built=15, total disposed=8, undisposed=7\nGeneric: built=8, distinct returned=1, disposed after registry shutdown=1\n  Builds triggered AFTER registry disposal by reload signal: 7; expected 0\n  Total built=15, total disposed=8, undisposed=7\n\n### Steps to reproduce\n\n1. Extract the attached minimal console project.\n2. Run it using the .NET 9 SDK:\n\n   ```powershell\n   dotnet run --project PollyRegistryRepro.csproj --configuration Release\n   ```\n\n3. The program starts eight callers and uses a Barrier inside pipeline\n   configuration to force concurrent initialization of the same key.\n4. Each constructed instance registers an OnPipelineDisposed callback\n   and the same reload token.\n5. After all callers finish, the program awaits registry.DisposeAsync().\n6. It then cancels the reload token and prints the construction and\n   disposal counts.\n7. It repeats the scenario for the generic registry path.\n\nCounters use Interlocked operations. The reproduction does not depend\non Thread.Sleep.\n\nThe diagnostic program exits successfully when it observes the reported\nbug; it is not a regression test for the corrected behavior.\n\n[polly-registry-repro_.zip](https://github.com/user-attachments/files/33909660/polly-registry-repro_.zip)\n\n### Exception(s) (if any)\n\nNone. The problem is incomplete cleanup and reload activity after\ndisposal, rather than an exception.\n\n### Polly version\n\nPolly.Core 8.8.0\n\n### .NET Version\n\n.NET SDK 9.0.316; target framework net9.0; Windows\n\n### Anything else?\n\nRelated issue: #2539.\n\nI understand that ConcurrentDictionary.GetOrAdd can allow multiple\ninstances to be constructed and that the earlier discussion raised\nconcerns about introducing locks.\n\nI would like to contribute a focused fix that cleans up discarded\ninstances while preserving the existing cached lookup behavior,\ntogether with deterministic regression tests for generic and\nnon-generic pipelines.\n\nWould this cleanup-focused approach be acceptable?"

