body = "While most types maintain consistency between `equals()` and `hashCode()` after string serialization and parsing (`JsonElement#toString()` + `JsonParser#parse(String)`, integers do not. `equals()` returns true, but the hash codes are different.\r\n\r\n```\r\n  public void testEqualsIntegerAndLazilyParsedInteger() {\r\n    MoreAsserts.assertEqualsAndHashCode(new JsonPrimitive(42), new JsonPrimitive(new LazilyParsedNumber(\"42\")));\r\n  }\r\n```"
