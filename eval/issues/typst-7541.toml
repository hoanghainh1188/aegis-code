body = "### Description\n\n```typ\n#set page(width: 4cm, height: auto, margin: .5cm, background: pad(.5cm, rect(width: 100%, height: 100%, stroke: .4pt+blue)))\n#set par(justify: true)\n\n#let n = h(100%-3.1em);\n\n#n;Foo Bar Buzz\n\n#n;Foo Bar#sym.zws;Buzz\n```\n\n![Image](https://github.com/user-attachments/assets/2a07e56f-acc5-45db-ad98-907552988fae)\n\nWe would not expect the zws to cause the text to hang into the margin. Indeed, that is the behavior when compiling the sample with 0.13.1 and before.\n\nI initially expected the origin to be the character-level justification PR, but further investigation led me to exactly 154980b (#6866). It appears a similar issue was found and fixed for RTL text (#7168), but this case is still borked as of 0.14.1 / f3d08bfb.\n\nNot sure if this is the only remaining issue with the commit, at least `sym.space.*` seems to be fine.\n\n---\n\nI first became aware of the issue on Discord: [Typst › quick-questions 🗪](https://discord.com/channels/1054443721975922748/1088371919725793360/1446613048017162301), thanks to saffronner."

