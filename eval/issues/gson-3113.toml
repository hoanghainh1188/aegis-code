body = "**The problem**\n\n`JsonReader.readEscapeCharacter()` ([`JsonReader.java:1855`](https://github.com/google/gson/blob/main/gson/src/main/java/com/google/gson/stream/JsonReader.java#L1855)) reads 4 hex digits, casts to `(char)`, and returns unchecked at [line 1882](https://github.com/google/gson/blob/main/gson/src/main/java/com/google/gson/stream/JsonReader.java#L1882). No `Character.isSurrogate` / `0xD800..0xDFFF` gate anywhere. Callers at [line 1244](https://github.com/google/gson/blob/main/gson/src/main/java/com/google/gson/stream/JsonReader.java#L1244) (string-value) and [line 1340](https://github.com/google/gson/blob/main/gson/src/main/java/com/google/gson/stream/JsonReader.java#L1340) (skip-string) consume the raw char with no validation. Both `setLenient(false)` and `Strictness.STRICT` accept the malformed input.\n\n**The specs**\n\n- [RFC 8259 §8.2](https://www.rfc-editor.org/rfc/rfc8259.html#section-8.2): \"behavior of software that receives JSON texts containing such values is unpredictable; for example, implementations might return different values for the length of a string value or even suffer fatal runtime exceptions.\"\n- [RFC 7493 §2.1](https://www.rfc-editor.org/rfc/rfc7493.html#section-2.1) (I-JSON): \"Object member names, and string values in arrays and object members, MUST NOT include code points that identify Surrogates or Noncharacters as defined by [UNICODE]... `\\uDEAD` is invalid because it is an unpaired surrogate.\"\n- [RFC 8785 §3.2.2.2](https://www.rfc-editor.org/rfc/rfc8785.html#section-3.2.2.2) (JCS): \"occurrences of such data MUST cause a compliant JCS implementation to terminate with an appropriate error.\"\n\n**Reproducer (gson 2.14.0, JDK 21, `Strictness.STRICT`)**\n\n```java\nimport com.google.gson.*;\nimport com.google.gson.stream.*;\nimport java.io.StringReader;\n\npublic class Repro3113 {\n    public static void main(String[] args) throws Exception {\n        String[] docs = {\"{\\\"k\\\":\\\"\\\\uD800\\\"}\", \"{\\\"k\\\":\\\"\\\\uDC00\\\"}\", \"{\\\"\\\\uDC00\\\":1}\"};\n        for (String doc : docs) {\n            JsonReader r = new JsonReader(new StringReader(doc));\n            r.setStrictness(Strictness.STRICT);\n            r.beginObject();\n            String name = r.nextName();\n            String val = r.peek() == JsonToken.NUMBER\n                    ? String.valueOf(r.nextInt()) : r.nextString();\n            System.out.println(\"input=\" + doc\n                + \" ACCEPT name.char0=0x\" + Integer.toHexString(name.charAt(0))\n                + \" val.char0=0x\" + Integer.toHexString(val.charAt(0)));\n        }\n    }\n}\n```\n\nOutput:\n```\ninput={\"k\":\"\\uD800\"} ACCEPT name.char0=0x6b val.char0=0xd800\ninput={\"k\":\"\\uDC00\"} ACCEPT name.char0=0x6b val.char0=0xdc00\ninput={\"\\uDC00\":1}  ACCEPT name.char0=0xdc00 val.char0=0x31\n```\n\n**How to read the output**\n\n- `input=` shows the JSON document fed in.\n- `ACCEPT` means the parser returned successfully (no exception).\n- `name.char0` is the hex value of the first char of the field name.\n- `val.char0` is the hex value of the first char of the value.\n- Row 1: field name is `\"k\"` (`0x6b`), value's first char is `0xd800` — a lone high surrogate returned as-is in the Java `String`.\n- Row 2: same field name, value's first char is `0xdc00` — a lone low surrogate returned as-is.\n- Row 3: field NAME itself starts with `0xdc00` (a lone low surrogate); the value is just the digit `1` (`0x31`).\n\nAll three should have rejected under `Strictness.STRICT` per the RFC 7493 / RFC 8785 requirements above.\n\n**Suggested fix**\n\nThe return at [`JsonReader.java:1882`](https://github.com/google/gson/blob/main/gson/src/main/java/com/google/gson/stream/JsonReader.java#L1882) is the site to add the guard. Rejecting under `Strictness.STRICT` preserves current behavior in `Strictness.LEGACY_STRICT` / `Strictness.LENIENT` — no Android-compat break.\n"
