body = "This was reported by a user and I didn't check it myself but it looks true from the code.\n\n`ExecutionEngine._process_start_next()` just schedules `self.scraper.start_itemproc_async()` for items produced from `start()`, and so if there are async pipelines, nothing in the Scrapy code requires waiting until they finish before e.g. closing the spider (that's one of the downsides of `_schedule_coro()` as opposed to awaiting). I don't see a simple fix though, we may need to add some machinery to wait for these."

