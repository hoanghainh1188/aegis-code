body = "## Description\n\nAccording to [RFC 6901 (JSON Pointer)](https://datatracker.ietf.org/doc/html/rfc6901), reference tokens inside a JSON Pointer must escape two characters:\n\n- `~` → `~0`\n- `/` → `~1`\n\nWhen `z.toJSONSchema()` builds the `$ref` URI fragment from a schema's `.meta({ id })`, it uses the raw id without applying these escapes. The `$defs` key itself is a plain JSON object key and does not need escaping — but the `$ref` pointer path does, and it currently doesn't get it.\n\n## Steps to reproduce\n\n```typescript\nimport { z } from 'zod';\n\nconst User = z.object({ name: z.string() })\n  .meta({ id: 'Shared/User~' });\n\nconsole.log(z.toJSONSchema(z.object({ User })));\n```\n\n## Actual output\n\n```json\n{\n  \"properties\": {\n    \"User\": {\n      \"$ref\": \"#/$defs/Shared/User~\"\n    }\n  },\n  \"$defs\": {\n    \"Shared/User~\": {}\n  }\n}\n```\n\nThe `$ref` pointer token `Shared/User~` is not escaped — `/` should be `~1` and `~` should be `~0`.\n\n## Expected output\n\n```json\n{\n  \"properties\": {\n    \"User\": {\n      \"$ref\": \"#/$defs/Shared~1User~0\"\n    }\n  },\n  \"$defs\": {\n    \"Shared/User~\": {}\n  }\n}\n```\n\nThe `$defs` key stays as the original unescaped id. Only the `$ref` pointer path needs encoding."

