# cargo deny cho chính aegis-code (#42). Allow-list cho repo đích nằm ở
# policies/deny.toml (#12), không dùng file này.

[graph]
all-features = true

[advisories]
# Mọi advisory RustSec (lỗ hổng, unmaintained, unsound, yanked) đều làm fail.
# Bỏ qua một advisory phải ghi id và lý do ở `ignore`.
yanked = "deny"
unmaintained = "all"
ignore = [
    # `rsa` và `crypto-bigint` 0.5, kéo vào bởi `openidconnect` (#29): hai
    # advisory về rò rỉ thời gian khi dùng khóa bí mật (giải mã, ký). Server
    # chỉ kiểm chữ ký ID token bằng khóa công khai của SSO, không giữ khóa
    # RSA/EC bí mật nào. Gỡ khi `openidconnect` lên bản đã sửa.
    { id = "RUSTSEC-2023-0071", reason = "chỉ kiểm chữ ký bằng khóa công khai (#29)" },
    { id = "RUSTSEC-2026-0387", reason = "chỉ kiểm chữ ký bằng khóa công khai (#29)" },
]

[licenses]
# Chỉ license permissive. Thêm license mới phải qua review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Crate trong workspace có `publish = false`, không cần license.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# `serde_json/preserve_order` (#20) không chặn ở đây: cargo deny không phân
# biệt build-dependency, mà tree-sitter bật feature này trong build.rs, vốn
# được resolve riêng và không vào binary. Thứ tự key lúc chạy được giữ bằng
# test `serde_json_map_keeps_keys_sorted` trong aegis-provider.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
