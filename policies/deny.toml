# cargo deny cho repo đích (#12, design §7). Gate chạy file này khi bản vá đổi
# Cargo.toml / Cargo.lock:
#   cargo deny --config <aegis>/policies/deny.toml check
# Crate mới mà bản vá được phép thêm nằm ở policies/allowed-crates.toml.
# Cấu hình cho chính aegis-code là deny.toml ở gốc repo (#42), không phải file này.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Repo đích có thể có license chưa nằm trong danh sách; khi đó thêm vào đây
# sau khi duyệt, không tắt kiểm tra.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
