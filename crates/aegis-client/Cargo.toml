[package]
name = "aegis-client"
description = "aegis: the developer's client of aegis-server's API (#231)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aegis"
path = "src/main.rs"

# HTTP and JSON only: no agent, gate, Docker or model provider.
[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
