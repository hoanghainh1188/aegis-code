[package]
name = "aegis-ledger"
description = "Per-issue JSON record: tokens, cost, outcome, review for KPI (design §4.3, §8)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-provider = { version = "0.1.0", path = "../aegis-provider" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util"] }
toml = "1.1.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
