[package]
name = "aegis-ledger"
description = "Per-issue JSON record: tokens, cost, outcome, review for KPI (design §4.3, §8)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-provider = { path = "../aegis-provider" }
serde = { workspace = true, features = ["derive"] }
# Read back the exact f64 that was written: costs are summed from many
# events, and a ledger copied between stores must not drift (#22).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
