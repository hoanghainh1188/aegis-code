[package]
name = "aegis-server"
description = "The platform as a service: internal HTTP API, webhooks, job queue in PostgreSQL and workers (ADR 0003, #23, #25)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-lang = { path = "../aegis-lang" }
aegis-ledger = { path = "../aegis-ledger" }
aegis-lifecycle = { path = "../aegis-lifecycle" }
aegis-pr = { path = "../aegis-pr" }
aegis-provider = { path = "../aegis-provider" }
aegis-secrets = { path = "../aegis-secrets", features = ["aws"] }
aegis-sonar-batch = { path = "../aegis-sonar-batch" }
aegis-store = { path = "../aegis-store" }
aegis-tracker = { path = "../aegis-tracker" }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio", "tracing"] }
getrandom = "0.4.3"
hmac = "0.13.0"
openidconnect = { version = "4.1.0", default-features = false }
prometheus-client = "0.25.1"
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
subtle = "2.6.1"
time = { workspace = true, features = ["formatting", "macros", "parsing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tower-http = { version = "0.6.11", features = ["limit", "timeout", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Bedrock backend for config/customer-jp.toml (`[modes] customer_jp`).
bedrock = ["aegis-provider/bedrock"]

[dev-dependencies]
# Only to build ID tokens in tests: openidconnect's claims are chrono
# types, and it pulls chrono in anyway (#578).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
aws-lc-rs.workspace = true
base64.workspace = true
aegis-gate = { path = "../aegis-gate" }
aegis-secrets = { path = "../aegis-secrets" }
aegis-store = { path = "../aegis-store", features = ["testing"] }
http-body-util.workspace = true
rsa = { version = "0.9.10", features = ["getrandom"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock.workspace = true
