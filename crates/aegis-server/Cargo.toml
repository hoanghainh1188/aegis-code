[package]
name = "aegis-server"
description = "The platform as a service: internal HTTP API, job queue in PostgreSQL and workers (ADR 0003, #23)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-lang = { path = "../aegis-lang" }
aegis-ledger = { path = "../aegis-ledger" }
aegis-lifecycle = { path = "../aegis-lifecycle" }
aegis-provider = { path = "../aegis-provider" }
aegis-store = { path = "../aegis-store" }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio", "tracing"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower-http = { version = "0.6.11", features = ["limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std"] }

[features]
# Bedrock backend for config/customer-jp.toml (`[modes] customer_jp`).
bedrock = ["aegis-provider/bedrock"]

[dev-dependencies]
aegis-store = { path = "../aegis-store", features = ["testing"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
