{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<section aria-labelledby="jobs-heading">
  <h1 id="jobs-heading">Jobs</h1>
  {% if !creatable.is_empty() %}
  <details class="create"{% if rows.is_empty() %} open{% endif %}>
    <summary class="button">New job</summary>
    <form action="/jobs" method="post" class="inline">
      {% include "form_guard.html" %}
      <label>Repo
        <select name="repo_id" required>
          {% for c in creatable %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}
        </select>
      </label>
      <label>From
        <select name="source" required>
          {% for c in sources %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}
        </select>
      </label>
      <label>Issue
        <input type="text" name="issue_ref" required maxlength="256" placeholder="owner/repo#12" autocomplete="off">
      </label>
      <button type="submit">Create job</button>
    </form>
  </details>
  {% endif %}
  <form class="filters" action="/jobs" method="get" hx-get="/jobs" hx-target="#jobs-table" hx-push-url="true" hx-trigger="change">
    <label>Repo
      <select name="repo_id">
        <option value="">all</option>
        {% for c in repos %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}
      </select>
    </label>
    <label>Status
      <select name="status">
        <option value="">all</option>
        {% for c in statuses %}<option value="{{ c.value }}"{% if c.selected %} selected{% endif %}>{{ c.label }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Filter</button>
  </form>
  <div id="jobs-table">
  {% include "jobs_table.html" %}
  </div>
</section>
{% endblock %}
