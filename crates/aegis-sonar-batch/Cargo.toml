[package]
name = "aegis-sonar-batch"
description = "Group Sonar warnings by AST node or data flow, merge into integration branch (design §3.4, §6.3)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
