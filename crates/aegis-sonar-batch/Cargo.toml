[package]
name = "aegis-sonar-batch"
description = "Group Sonar warnings by AST node or data flow, merge into integration branch (design §3.4, §6.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
reqwest = { workspace = true, features = ["json", "query", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
wiremock.workspace = true
