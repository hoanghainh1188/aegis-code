[package]
name = "aegis-provider"
description = "ModelProvider trait with Claude API and Bedrock backends, cache_control placement, jp. guard (design §4, §5.1, §7)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aws-config = { version = "1.12.0", optional = true }
aws-sdk-bedrockruntime = { version = "1.148.0", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

[features]
# Bedrock backend (customer-code configuration, ap-northeast-1 with `jp.` profiles).
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime"]

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
wiremock = "0.6.5"
