[package]
name = "aegis-provider"
description = "ModelProvider trait with Claude API and Bedrock backends, cache_control placement, jp. guard (design §4, §5.1, §7)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-secrets = { path = "../aegis-secrets" }
aws-config = { workspace = true, optional = true }
# Tắt feature `rustls` mặc định: nó kéo stack hyper 0.14 + rustls 0.21 đang có advisory (#42).
aws-sdk-bedrockruntime = { version = "1.148.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url = "2.5.8"

[features]
# Bedrock backend (customer-code configuration, ap-northeast-1 with `jp.` profiles).
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime"]

[[test]]
name = "live_bedrock"
required-features = ["bedrock"]

[dev-dependencies]
aegis-secrets = { path = "../aegis-secrets" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
wiremock.workspace = true
