[package]
name = "aegis-lifecycle"
description = "Lifecycle of one issue: classify, agent loop, gate, escalate, PR or stop, ledger (design §2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-aci = { path = "../aegis-aci" }
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
aegis-ledger = { path = "../aegis-ledger" }
aegis-orchestrator = { path = "../aegis-orchestrator" }
aegis-pr = { path = "../aegis-pr" }
aegis-provider = { path = "../aegis-provider" }
aegis-router = { path = "../aegis-router" }
aegis-secrets = { path = "../aegis-secrets" }
aegis-sonar-batch = { path = "../aegis-sonar-batch" }
aegis-store = { path = "../aegis-store" }
aegis-tracker = { path = "../aegis-tracker" }
aws-config = { workspace = true, default-features = false, features = ["rustls", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
futures = "0.3.34"
regex.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "fs", "io-util"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
aegis-docker-proxy = { path = "../aegis-docker-proxy" }
aegis-mtls = { path = "../aegis-mtls" }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
aws-lc-rs.workspace = true
base64.workspace = true
aegis-store = { path = "../aegis-store", features = ["testing"] }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock.workspace = true
