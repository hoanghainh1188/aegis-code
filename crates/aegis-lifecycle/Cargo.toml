[package]
name = "aegis-lifecycle"
description = "Lifecycle of one issue: classify, agent loop, gate, escalate, PR or stop, ledger (design §2)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-aci = { path = "../aegis-aci" }
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
aegis-ledger = { path = "../aegis-ledger" }
aegis-orchestrator = { path = "../aegis-orchestrator" }
aegis-pr = { path = "../aegis-pr" }
aegis-provider = { path = "../aegis-provider" }
aegis-router = { path = "../aegis-router" }
aegis-secrets = { path = "../aegis-secrets" }
aegis-sonar-batch = { path = "../aegis-sonar-batch" }
aegis-store = { path = "../aegis-store" }
aegis-tracker = { path = "../aegis-tracker" }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "time", "macros"] }
tokio-util = "0.7.20"
toml = "1.1.8"

[dev-dependencies]
aegis-store = { path = "../aegis-store", features = ["testing"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
