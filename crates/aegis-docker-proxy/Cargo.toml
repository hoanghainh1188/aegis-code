[package]
name = "aegis-docker-proxy"
description = "Filters the Docker API between aegis and the daemon, so holding its socket is not root of the machine (#321)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1.12.1"
http-body-util.workspace = true
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "std"] }
