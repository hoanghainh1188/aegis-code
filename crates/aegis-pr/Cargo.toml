[package]
name = "aegis-pr"
description = "PR writer: branch agent/<issue-id>, PR template, Golden Master allowed-change list (design §6.2, §6.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-provider = { path = "../aegis-provider" }
aws-lc-rs.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde"] }

[dev-dependencies]
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true
aegis-lang = { path = "../aegis-lang" }
toml.workspace = true
