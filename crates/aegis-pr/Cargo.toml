[package]
name = "aegis-pr"
description = "PR writer: branch agent/<issue-id>, PR template, Golden Master allowed-change list (design §6.2, §6.4)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-provider = { path = "../aegis-provider" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
aegis-lang = { path = "../aegis-lang" }
toml = "1.1.8"
