[package]
name = "aegis-cli"
description = "Command-line entry point: run one issue or a batch."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aegis-local"
path = "src/main.rs"

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
aegis-ledger = { path = "../aegis-ledger" }
aegis-lifecycle = { path = "../aegis-lifecycle" }
aegis-pr = { path = "../aegis-pr" }
aegis-provider = { path = "../aegis-provider" }
aegis-store = { path = "../aegis-store" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util.workspace = true

[features]
# Bedrock backend for config/customer-jp.toml.
bedrock = ["aegis-provider/bedrock"]

[dev-dependencies]
aegis-store = { path = "../aegis-store", features = ["testing"] }
serde_json.workspace = true
wiremock.workspace = true
