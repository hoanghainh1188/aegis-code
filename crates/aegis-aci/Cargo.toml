[package]
name = "aegis-aci"
description = "ACI tools served over MCP: search_symbol, open, edit, run_tests (design §3.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
libc = "0.2.191"
regex = "1.13.1"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.1.8"

[dev-dependencies]
aegis-orchestrator = { path = "../aegis-orchestrator" }
aegis-provider = { path = "../aegis-provider" }
serde_json = "1.0.154"
