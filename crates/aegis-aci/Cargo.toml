[package]
name = "aegis-aci"
description = "ACI tools served over MCP: search_symbol, open, edit, run_tests (design §3.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-gate = { path = "../aegis-gate" }
aegis-lang = { path = "../aegis-lang" }
regex.workspace = true
rmcp = { workspace = true, features = ["default", "server", "macros", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
toml.workspace = true

[dev-dependencies]
aegis-orchestrator = { path = "../aegis-orchestrator" }
aegis-provider = { path = "../aegis-provider" }
serde_json.workspace = true
