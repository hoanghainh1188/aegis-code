[package]
name = "aegis-tracker"
description = "Jira and Backlog as issue trackers: tickets by JQL or filter with their logs, the job's end written back (#26)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { workspace = true, features = ["clock", "std", "serde"] }
reqwest = { workspace = true, features = ["form", "json", "query", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true
