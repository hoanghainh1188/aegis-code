[package]
name = "aegis-tracker"
description = "Jira and Backlog as issue trackers: tickets by JQL or filter with their logs, the job's end written back (#26)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
