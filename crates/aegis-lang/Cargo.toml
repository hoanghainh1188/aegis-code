[package]
name = "aegis-lang"
description = "Language profiles for target repos: detection, ACI grammar, edit checks, gate steps, dependencies (ADR 0004)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
regex.workspace = true
roxmltree = "0.21.1"
thiserror.workspace = true
toml.workspace = true
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-fsharp = "0.3.12"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kt = "0.1.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-vb-dotnet = "0.1.0"
