[package]
name = "aegis-gate"
description = "Gate runner in Docker: fmt, clippy, repro test, workspace test, coverage, Sonar (design §6.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-lang = { path = "../aegis-lang" }
libc = "0.2.191"
regex = "1.13.1"
# Blocking: the gate runs off the async runtime (spawn_blocking).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
toml = "1.1.8"
wiremock = "0.6.5"
