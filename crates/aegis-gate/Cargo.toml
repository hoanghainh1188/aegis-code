[package]
name = "aegis-gate"
description = "Gate runner in Docker: fmt, clippy, repro test, workspace test, coverage, Sonar (design §6.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-lang = { path = "../aegis-lang" }
libc.workspace = true
regex.workspace = true
# Blocking: the gate runs off the async runtime (spawn_blocking).
reqwest = { workspace = true, features = ["json", "rustls", "blocking", "query"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true
wiremock.workspace = true
