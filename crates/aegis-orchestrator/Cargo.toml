[package]
name = "aegis-orchestrator"
description = "Agent loop for one issue: state, steps, history collapsing (design §2, §3.3)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-provider = { path = "../aegis-provider" }
rmcp = { version = "3.6.0", default-features = false, features = ["client", "transport-child-process"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "process"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "test-util"] }
