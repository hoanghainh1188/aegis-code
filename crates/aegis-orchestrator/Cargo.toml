[package]
name = "aegis-orchestrator"
description = "Agent loop for one issue: state, steps, history collapsing (design §2, §3.3)."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aegis-provider = { version = "0.1.0", path = "../aegis-provider" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "test-util"] }
