[package]
name = "aegis-orchestrator"
description = "Agent loop for one issue: state, steps, history collapsing (design §2, §3.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-mtls = { path = "../aegis-mtls" }
aegis-provider = { path = "../aegis-provider" }
reqwest = { workspace = true, features = ["rustls"] }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
