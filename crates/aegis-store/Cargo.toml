[package]
name = "aegis-store"
description = "Durable platform state in PostgreSQL: repos, jobs, runs and the ledger (ADR 0003, #22)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aegis-ledger = { path = "../aegis-ledger" }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-aws-lc-rs",
] }
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

[features]
# `testing::test_db` for this crate's tests and those of its users.
testing = []

[dev-dependencies]
aegis-store = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
