{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "aegis.fullname" .) -}}
{{- $pg := .Values.postgresql -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    {{- include "aegis.selector" (list . "postgresql") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegis.selector" (list . "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The postgres user of the alpine image.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - {name: POSTGRES_USER, value: aegis}
            - {name: POSTGRES_DB, value: aegis}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres/password}
            # A directory of the volume: its root may hold lost+found.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aegis", "-d", "aegis"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aegis", "-d", "aegis"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: password, mountPath: /run/secrets/postgres, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: password
          secret:
            secretName: {{ required "postgresql.secretName is required with postgresql.enabled" $pg.secretName }}
            defaultMode: 0400
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegis.selector" (list . "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 5432}
      from:
        - podSelector:
            matchLabels:
              {{- include "aegis.selector" (list . "api") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "aegis.workerNamespace" . }}
          podSelector:
            matchLabels:
              {{- include "aegis.selector" (list . "worker") | nindent 14 }}
{{- end }}
{{- end }}
