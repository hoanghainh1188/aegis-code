{{- $workerNs := include "aegis.workerNamespace" . -}}
{{- range $ns := uniq (list .Release.Namespace $workerNs) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" $ }}-config
  namespace: {{ $ns }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
data:
  {{- include "aegis.configData" $ | nindent 2 }}
{{- end }}
