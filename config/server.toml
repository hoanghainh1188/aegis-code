# aegis-server (#23). Relative paths are taken from the directory the
# server starts in. No secret is in this file (#30).

# Where secrets are read: the database URL (AEGIS_DATABASE_URL), each mode's
# API key, webhook secrets, Git and Sonar tokens. Required, no default.
[secrets]
# Dev and tests: the process environment, secret X being variable X.
source = "env"
# A deployment: AWS Secrets Manager, secret X being `<prefix>X`, read with
# the instance role. With `customer_jp` the region must be ap-northeast-1.
# source = "aws"
# region = "ap-northeast-1"
# prefix = "aegis/prod/"
# Read every secret again this often (rotation); a refused call also
# reads its secret again.
# refresh_s = 300

# Each repo's jobs run with the configuration of its mode (`repos.mode`)
# and the repo's own settings (`repos.config`, #24). Leave a mode out and
# its repos' jobs stop with a reason.
[modes]
poc = "config/poc.toml"
# Bedrock in Tokyo: build with `--features bedrock`, and deploy where the
# customer's data may be (ADR 0003 §6). Refused at start unless every call
# stays in Japan.
# customer_jp = "config/customer-jp.toml"

[api]
# Internal API without authentication yet (#29): keep it on loopback.
listen = "127.0.0.1:8080"

[worker]
# Jobs this process runs at once. A repo's own limit is
# `repos.max_concurrent_jobs`, over all workers.
max_workers = 4
# The most a job may spend over all its attempts; a repo's budget may be
# lower.
max_cost_usd = 4.0
lease_s = 60
renew_s = 20
poll_s = 5
# On SIGTERM: wait this long for running jobs, then release them.
drain_s = 600
# First wait after an infrastructure failure; doubles, at most 3 retries.
retry_base_s = 30
