# aegis-server (#23). Database: AEGIS_DATABASE_URL. Relative paths are
# taken from the directory the server starts in.

# The run configuration of every job; one repo until #24.
run_config = "config/poc.toml"

[api]
# Internal API without authentication yet (#29): keep it on loopback.
listen = "127.0.0.1:8080"

[worker]
# Jobs this process runs at once.
max_workers = 4
# Jobs of one repo running at once, over all workers.
max_concurrent_jobs = 2
lease_s = 60
renew_s = 20
poll_s = 5
# On SIGTERM: wait this long for running jobs, then release them.
drain_s = 600
# First wait after an infrastructure failure; doubles, at most 3 retries.
retry_base_s = 30

# A repo's own limit, by its id in the database.
# [[worker.repos]]
# repo_id = 1
# max_concurrent_jobs = 1
