# aegis-server (#23). Database: AEGIS_DATABASE_URL. Relative paths are
# taken from the directory the server starts in.

# Each repo's jobs run with the configuration of its mode (`repos.mode`)
# and the repo's own settings (`repos.config`, #24). Leave a mode out and
# its repos' jobs stop with a reason.
[modes]
poc = "config/poc.toml"
# Bedrock in Tokyo: build with `--features bedrock`, and deploy where the
# customer's data may be (ADR 0003 §6). Refused at start unless every call
# stays in Japan.
# customer_jp = "config/customer-jp.toml"

[api]
# `/api/v1` takes service tokens and the dashboard a sign-in (#29), so the
# API may listen beyond loopback, behind TLS. Pages answer only to
# `auth.public_url`'s host and to loopback.
listen = "127.0.0.1:8080"

# Secrets from the environment: AEGIS_SESSION_KEY (at least 32 random
# bytes; signs the review form's time) and AEGIS_OIDC_CLIENT_SECRET.
# Roles and tokens: `aegis-server grant` and `aegis-server token`.
[auth]
# public_url = "https://aegis.example.com"
session_hours = 12
# Per service token, per API process.
api_requests_per_minute = 120

# The company SSO; without it the dashboard cannot be signed in to.
# [auth.oidc]
# issuer = "https://login.example.com/realms/acme"
# client_id = "aegis"

[worker]
# Jobs this process runs at once. A repo's own limit is
# `repos.max_concurrent_jobs`, over all workers.
max_workers = 4
# The most a job may spend over all its attempts; a repo's budget may be
# lower.
max_cost_usd = 4.0
lease_s = 60
renew_s = 20
poll_s = 5
# On SIGTERM: wait this long for running jobs, then release them.
drain_s = 600
# First wait after an infrastructure failure; doubles, at most 3 retries.
retry_base_s = 30
