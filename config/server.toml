# aegis-server (#23). Relative paths are taken from the directory the
# server starts in. No secret is in this file (#30).

# Where secrets are read: the database URL (AEGIS_DATABASE_URL), each mode's
# API key, webhook secrets, Git and Sonar tokens. Required, no default.
[secrets]
# Dev and tests: the process environment, secret X being variable X.
source = "env"
# A deployment: AWS Secrets Manager, secret X being `<prefix>X`, read with
# the instance role. With `customer_jp` the region must be ap-northeast-1.
# source = "aws"
# region = "ap-northeast-1"
# prefix = "aegis/prod/"
# On premises (#261): one file per secret, secret X being `<dir>/X`, as
# Docker secrets, a Kubernetes Secret volume or systemd's LoadCredential=
# give them. Each file only its owner may read (0400 or 0600); a link
# must stay inside `dir`. Replacing a file rotates the secret.
# source = "file"
# dir = "/run/secrets"
# Read every secret again this often (rotation); a refused call also
# reads its secret again.
# refresh_s = 300

# Each repo's jobs run with the configuration of its mode (`repos.mode`)
# and the repo's own settings (`repos.config`, #24). Leave a mode out and
# its repos' jobs stop with a reason.
# Each mode a repo may have, by name, and its run configuration (#592). A
# name is 1-64 of a-z, 0-9, `_` and `-`; `_` and `-` are the same, so
# `customer_jp` and `customer-jp` name one mode. A mode file's
# `[residency]` says where its code may go: `allowed_model_prefixes`
# (every tier's model must start with one) or `local_only = true` (a
# `local` provider only). The server refuses to start when a mode breaks
# its own, and its provider checks it again before each request. A
# `local_only` mode's `base_url` must be on a local network (loopback, a
# private address, a dotless or `.internal` name, or one in `local_hosts`).
# Prefixes say which models, not which region: keep a Bedrock region and
# its prefixes (`eu-central-1` and `eu.`) together.
[modes]
poc = "config/poc.toml"
# Bedrock in Tokyo: build with `--features bedrock`, and deploy where the
# customer's data may be (ADR 0003 §6). Refused at start unless every call
# stays in Japan.
# customer-jp = "config/customer-jp.toml"
# Any other, e.g. Bedrock in Frankfurt with `[residency]
# allowed_model_prefixes = ["eu."]`, or an air-gapped local model server
# with `[residency] local_only = true`:
# customer-eu = "/etc/aegis/modes/customer-eu.toml"
# local-airgap = "/etc/aegis/modes/local-airgap.toml"

[api]
# `/api/v1` takes service tokens and the dashboard a sign-in (#29), so the
# API may listen beyond loopback, behind TLS. Pages answer only to
# `auth.public_url`'s host and to loopback.
listen = "127.0.0.1:8080"

# `/metrics` for Prometheus (#32), served by every role on its own port.
# No token: open this port to the private network only (Prometheus' security
# group), never next to the API. Shows counts, never a job or a secret.
[metrics]
listen = "127.0.0.1:9464"

# Its secrets are in [secrets] with the others, checked when the API
# starts: AEGIS_SESSION_KEY (at least 32 random bytes; signs the review
# form's time), and AEGIS_OIDC_CLIENT_SECRET with [auth.oidc].
# Roles and tokens: `aegis-server --config <file> grant|token …`.
[auth]
# public_url = "https://aegis.example.com"
session_hours = 12
# Per service token, per API process.
api_requests_per_minute = 120
# Requests without a live token, per client address, per API process;
# past it the address is refused before the token is looked up.
api_failures_per_minute = 20
# Proxies in front of the API that append to X-Forwarded-For (1 behind the
# ALB of deploy/tofu); 0 trusts no header and takes the TCP peer.
trusted_proxies = 0

# The company SSO; without it the dashboard cannot be signed in to.
# [auth.oidc]
# issuer = "https://login.example.com/realms/acme"
# client_id = "aegis"

# Each repo's monthly cap is set through the API (`PUT
# /api/v1/repos/{id}/budget`, maintainer or admin); a repo with less than
# `worker.max_cost_usd` left of its month gets no new job (#31).
[budget]
# Where a month begins.
time_zone = "UTC"
# The dashboard warns from this share of a cap.
warn_ratio = 0.8

[worker]
# Jobs this process runs at once. A repo's own limit is
# `repos.max_concurrent_jobs`, over all workers.
max_workers = 4
# The most a job may spend over all its attempts; a repo's budget may be
# lower.
max_cost_usd = 4.0
lease_s = 60
renew_s = 20
poll_s = 5
# On SIGTERM: wait this long for running jobs, then release them.
drain_s = 600
# First wait after an infrastructure failure; doubles, at most 3 retries.
retry_base_s = 30
# Queued jobs are claimed by SLA level (#524): P1, P2, P3 (from an ITSM
# ticket, #453), then jobs with none, the sooner deadline first. Each this
# long a job has waited lifts it one level, so no job waits for ever behind
# newer P1s. Without SLAs the queue is first in, first out.
sla_aging_s = 3600
# The repos' caches on this worker's disk (#593), under each mode's
# state_dir: every 15 minutes a sweep removes the caches no job has used for
# cache_ttl_days, then, above max_cache_disk_gb, the least recently used
# until they take 85% of it. A repo with a running job keeps its caches.
# 0 turns either off. aegis_workspace_disk_bytes shows what the disk holds.
max_cache_disk_gb = 60
cache_ttl_days = 14

[trackers]
# The Jira/Backlog filters of the repos (`tracker` in their settings) are
# polled this often, by one `api` process at a time (#26); 0 polls none.
poll_s = 300

[sonar]
# Each repo with `sonar` and `sonar_poll` in its settings is polled for new
# warnings on its own `sonar_poll.every_s` (#27); this is how often the
# `api` role looks which are due, one process at a time. 0 polls none.
check_s = 60

[reviews]
# Review rounds a PR of the agent may have after the job that opened it
# (#243): each goes on with the PR's branch and has a budget of its own.
max_rounds = 3

[web]
# Let an admin make a repo's webhooks from its "Connection to the forge"
# page with a forge token given once (#376): GitHub `admin:repo_hook`,
# GitLab Maintainer. The token is used for that request and dropped, never
# kept, logged or audited. Off unless turned on.
make_webhooks = false

# ChatOps (#594): Slack and Teams incoming webhooks told by the workers of
# a PR opened, a diagnosis with no PR, a P1 job stopped, and a repo's or
# tenant's monthly budget at warn_ratio or 100%. Each channel names the
# secret in [secrets] that holds its webhook's URL: the URL is a token and
# never goes in this file. tenants / repos (slugs) keep a channel to those;
# events (pr_opened, diagnosed, p1_stopped, budget) to those, all if left
# out. Each post times out after 5 s; a failure is only logged and counted
# in aegis_chat_messages_total.
# [[chatops.channels]]
# kind = "slack"            # or "teams" (Incoming Webhook or Workflows URL)
# webhook_env = "AEGIS_SLACK_WEBHOOK_URL"
# tenants = ["acme"]
# repos = []
# events = ["pr_opened", "p1_stopped", "budget"]

# The instance's GitHub App (ADR 0017): repos with [settings.app] take
# tokens from it, minted per use, instead of a fork and a PAT. Left out,
# the instance runs as before and refuses repos on the app path. The key
# and the app's webhook secret live in [secrets] with the others.
# [github_app]
# app_id = 123456          # or client_id = "Iv23…", GitHub's preferred issuer
# api = "https://api.github.com"
# private_key_env = "AEGIS_GITHUB_APP_PRIVATE_KEY"
# webhook_secret_env = "AEGIS_GITHUB_APP_WEBHOOK_SECRET"
