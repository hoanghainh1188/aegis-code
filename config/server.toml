# aegis-server (#23). Relative paths are taken from the directory the
# server starts in. No secret is in this file (#30).

# Where secrets are read: the database URL (AEGIS_DATABASE_URL), each mode's
# API key, webhook secrets, Git and Sonar tokens. Required, no default.
[secrets]
# Dev and tests: the process environment, secret X being variable X.
source = "env"
# A deployment: AWS Secrets Manager, secret X being `<prefix>X`, read with
# the instance role. With `customer_jp` the region must be ap-northeast-1.
# source = "aws"
# region = "ap-northeast-1"
# prefix = "aegis/prod/"
# Read every secret again this often (rotation); a refused call also
# reads its secret again.
# refresh_s = 300

# Each repo's jobs run with the configuration of its mode (`repos.mode`)
# and the repo's own settings (`repos.config`, #24). Leave a mode out and
# its repos' jobs stop with a reason.
[modes]
poc = "config/poc.toml"
# Bedrock in Tokyo: build with `--features bedrock`, and deploy where the
# customer's data may be (ADR 0003 §6). Refused at start unless every call
# stays in Japan.
# customer_jp = "config/customer-jp.toml"

[api]
# `/api/v1` takes service tokens and the dashboard a sign-in (#29), so the
# API may listen beyond loopback, behind TLS. Pages answer only to
# `auth.public_url`'s host and to loopback.
listen = "127.0.0.1:8080"

# `/metrics` for Prometheus (#32), served by every role on its own port.
# No token: open this port to the private network only (Prometheus' security
# group), never next to the API. Shows counts, never a job or a secret.
[metrics]
listen = "127.0.0.1:9464"

# Its secrets are in [secrets] with the others, checked when the API
# starts: AEGIS_SESSION_KEY (at least 32 random bytes; signs the review
# form's time), and AEGIS_OIDC_CLIENT_SECRET with [auth.oidc].
# Roles and tokens: `aegis-server --config <file> grant|token …`.
[auth]
# public_url = "https://aegis.example.com"
session_hours = 12
# Per service token, per API process.
api_requests_per_minute = 120
# Requests without a live token, per client address, per API process;
# past it the address is refused before the token is looked up.
api_failures_per_minute = 20
# Proxies in front of the API that append to X-Forwarded-For (1 behind the
# ALB of deploy/tofu); 0 trusts no header and takes the TCP peer.
trusted_proxies = 0

# The company SSO; without it the dashboard cannot be signed in to.
# [auth.oidc]
# issuer = "https://login.example.com/realms/acme"
# client_id = "aegis"

# Each repo's monthly cap is set through the API (`PUT
# /api/v1/repos/{id}/budget`, maintainer or admin); a repo with less than
# `worker.max_cost_usd` left of its month gets no new job (#31).
[budget]
# Where a month begins.
time_zone = "UTC"
# The dashboard warns from this share of a cap.
warn_ratio = 0.8

[worker]
# Jobs this process runs at once. A repo's own limit is
# `repos.max_concurrent_jobs`, over all workers.
max_workers = 4
# The most a job may spend over all its attempts; a repo's budget may be
# lower.
max_cost_usd = 4.0
lease_s = 60
renew_s = 20
poll_s = 5
# On SIGTERM: wait this long for running jobs, then release them.
drain_s = 600
# First wait after an infrastructure failure; doubles, at most 3 retries.
retry_base_s = 30

[trackers]
# The Jira/Backlog filters of the repos (`tracker` in their settings) are
# polled this often, by one `api` process at a time (#26); 0 polls none.
poll_s = 300

[sonar]
# Each repo with `sonar` and `sonar_poll` in its settings is polled for new
# warnings on its own `sonar_poll.every_s` (#27); this is how often the
# `api` role looks which are due, one process at a time. 0 polls none.
check_s = 60
