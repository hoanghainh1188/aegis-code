# Bảng giá model cho aegis-ledger, $ / 1 triệu token (Proposal §4, design §4.3).
# Nguồn: https://platform.claude.com/docs/en/about-claude/pricing
# Đổi giá chỉ sửa file này; ledger không có giá nào trong code.
#
# Haiku 5.5 tính giá theo độ dài prompt (#54): lượt gọi có prompt trên
# 100.000 token (input + cache read + cache write) trả giá `long_prompt` cho
# cả lượt, kể cả output. Hệ số cache giữ nguyên.

# Phụ phí khi chạy qua Bedrock với profile vùng `jp.` (design §5.4).
# Nhân vào toàn bộ chi phí của lượt gọi.
regional_surcharge = 0.10

# M_write theo thời hạn cache (design §4.3).
[cache_write_multiplier]
5m = 1.25
1h = 2.0

# input/output: giá cơ sở R. cache_read_multiplier: M_read.
# Model ID của Bedrock (`jp.anthropic.<id>`) tra theo phần `<id>`.
[models.claude-fable-5-1]
input = 10.0
output = 50.0
cache_read_multiplier = 0.025

[models.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read_multiplier = 0.05

[models.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read_multiplier = 0.05

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read_multiplier = 0.10

[models.claude-haiku-5-5.long_prompt]
over_tokens = 100000
input = 0.50
output = 2.50
