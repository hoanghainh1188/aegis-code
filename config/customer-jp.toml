# Customer code: processing in Japan only. Bedrock from ap-northeast-1 with
# `jp.` inference profiles; any other model ID is refused (design §1, §7).

[provider]
kind = "bedrock"
region = "ap-northeast-1"
require_jp_profile = true

# Model per tier (design §5.1). Read by aegis-router.
# Core uses Opus with low effort because Sonnet 5.5 has no `jp.` profile on
# Bedrock yet (checked 2026-10-27, #19). Switch core once that profile exists.
[models.light]
id = "jp.anthropic.claude-haiku-5-5"

[models.core]
id = "jp.anthropic.claude-opus-5-5"
effort = "low"

[models.expert]
id = "jp.anthropic.claude-opus-5-5"
effort = "high"

# Every customer repo of the registry runs with this file (#24); the repo
# itself (URL, image, Sonar, allow-list, fork) comes from the registry, not
# from a [repo] section here. Its state stays on the Tokyo deployment
# (ADR 0003 §6).
[run]
state_dir = ".workspace/state-jp"
pricing = "config/pricing.toml"
step_timeout_s = 1800
sandbox = true
ledger = "postgres"

[budget]
max_cost_usd = 4.0
max_model_calls = 40

# Codebase-Memory (#203, #266): the impact note before the first gate run,
# as in poc.toml. The graph stays on this machine: the index is under
# `<state_dir>/index`, built in `fast` mode (no semantic layer, so no model
# download), and the server makes no network call.
[codebase_memory]
program = "codebase-memory-mcp"
args = ["--ui=false"]
env = [["HOME", "{index_dir}"]]

[identity]
name = "aegis-bot"
email = "aegis-bot@users.noreply.github.com"
