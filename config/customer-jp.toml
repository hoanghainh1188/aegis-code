# Customer code: processing in Japan only. Bedrock from ap-northeast-1 with
# `jp.` inference profiles; any other model ID is refused (design §1, §7).

[provider]
kind = "bedrock"
region = "ap-northeast-1"
require_jp_profile = true

# Model per tier (design §5.1). Read by aegis-router.
# Switch core to jp.anthropic.claude-sonnet-5-5 once that profile exists.
[models.light]
id = "jp.anthropic.claude-haiku-5-5"

[models.core]
id = "jp.anthropic.claude-opus-5-5"
effort = "low"

[models.expert]
id = "jp.anthropic.claude-opus-5-5"
effort = "high"

# [run], [repo] and [identity] as in poc.toml are added once a customer repo
# is chosen; until then this file only configures the provider and models.
