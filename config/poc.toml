# PoC on the internal repo: Claude API directly, no region constraint (design §1).

[provider]
kind = "claude_api"
api_key_env = "ANTHROPIC_API_KEY"

# Model per tier (design §5.1). Read by aegis-router.
[models.light]
id = "claude-haiku-5-5"

[models.core]
id = "claude-sonnet-5-5"

[models.expert]
id = "claude-opus-5-5"
effort = "high"

# Lifecycle of one issue (#16). Paths are relative to where `aegis` runs.
[run]
state_dir = ".workspace/state"
pricing = "config/pricing.toml"
step_timeout_s = 1800
# Gate steps in docker/<profile> images, --network none (#5); dependencies
# come from the fetch step behind the egress proxy (#66).
sandbox = true

# tldextract (scrapy's cookie middleware) downloads the Public Suffix List on
# first use; with no network it logs a warning into whichever test runs
# first (#104). Empty: no download, its bundled list.
[run.sandbox_env]
TLDEXTRACT_PUBLIC_SUFFIX_LIST_URLS = ""

[budget]
max_cost_usd = 4.0
max_model_calls = 40

# Codebase-Memory (design §3.2, #185): the call graph's `search_graph` and
# `trace_path` next to the ACI. Each job indexes its tree under
# `<state_dir>/index` (`{index_dir}`, the server's HOME), shared by every
# repo: the server's daemon is one per user and serves one cache.
# `codebase-memory-mcp` is on PATH: in docker/server, and locally as
# eval/README.md says. `--ui=false`: no graph UI on port 9749.
[codebase_memory]
program = "codebase-memory-mcp"
args = ["--ui=false"]
env = [["HOME", "{index_dir}"]]
tools = ["search_graph", "trace_path"]

# Target repo of the PoC (#2): a clone of the fork, each job gets a worktree.
[repo]
path = ".workspace/repos/scrapy"
language = "python"
base = "master"
key = "scrapy"
# Hidden tests of eval runs (#98): eval/issues lists scrapy's as files.
# Without the tests that need the Internet, as in the gate.
hidden_test = ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-m", "not requires_internet", "{tests}"]
# Where the agent puts its reproduction test (#140): the gate copies only
# the test's files onto the base.
conventions = """
- Put the reproduction test in a new file `tests/test_<module>_<topic>.py`,
  named after the module you fix, never in the module itself. Use the
  helpers `tests/` already has (`tests/mockserver`, `tests/spiders.py`,
  `scrapy.utils.test`) instead of writing new ones.
- Report its pytest id, `tests/test_<module>_<topic>.py::test_name`, and
  that file as its only file.
"""

# scrapy has no uv.lock: the fetch step (#66) installs it into .venv with
# the test requirements its tox.ini lists at that commit, those of the
# extra-deps env included (Pillow, boto3…: tests that need them are skipped
# otherwise), through the egress proxy. `#` starts a comment in tox's deps;
# `{[testenv]deps}` refers to another section and is read from it.
# Also the ruff that .pre-commit-config.yaml pins at that commit: .venv/bin
# comes first on PATH, so format and lint use it, not the image's newer one,
# whose new rules the repo never ran (#104).
[repo.overrides]
fetch = ["sh", "-c", """uv venv -q --allow-existing .venv && python3 -c '
import configparser
c = configparser.ConfigParser(interpolation=None)
c.read("tox.ini")
envs = ["test-requirements", "testenv", "testenv:extra-deps"]
lines = [l for e in envs if e in c for l in c[e].get("deps", "").splitlines()]
deps = (l.split("#")[0].strip() for l in lines)
deps = {d for d in deps if d and not d.startswith("{")}
import re
hooks = open(".pre-commit-config.yaml").read()
ruff = re.search(r"ruff-pre-commit\\s*\\n\\s*rev:\\s*v?([\\w.]+)", hooks)
if ruff:
    deps.add("ruff==" + ruff.group(1))
print("\\n".join(sorted(deps)))
' > .venv/test-requirements.txt && uv pip install -q --python .venv/bin/python -e . -r .venv/test-requirements.txt"""]

# From the measurements of #2: pytest in parallel, the venv's python on PATH.
# Tests marked `requires_internet` cannot pass with no network and wait for
# DNS to time out (10 minutes a run, #104), so they are left out.
[repo.overrides.gate]
test = ["python", "-m", "pytest", "-n", "auto", "-p", "no:cacheprovider", "-m", "not requires_internet", "scrapy", "tests", "--doctest-modules"]
test_output = "pytest"
coverage = ["python", "-m", "pytest", "-n", "auto", "-p", "no:cacheprovider", "-m", "not requires_internet", "--cov=scrapy", "--cov-report=xml:coverage.xml", "scrapy", "tests", "--doctest-modules"]
[repo.overrides.coverage]
format = "cobertura"
path = "coverage.xml"

[repo.fork]
owner = "hoanghainh1188"
name = "scrapy"
token_env = "GITHUB_TOKEN"

# Sonar step of the gate (#91), off until a server exists. Cloud needs
# `organization`; a Server leaves it out. `pull_request = false` for the
# Community Build (no pull request analysis).
# [sonar]
# url = "https://sonarcloud.io"
# token_env = "SONAR_TOKEN"
# organization = "hoanghainh1188"
# project_key = "hoanghainh1188_scrapy"

[identity]
name = "aegis-bot"
email = "aegis-bot@users.noreply.github.com"
