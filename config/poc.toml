# PoC on the internal repo: Claude API directly, no region constraint (design §1).

[provider]
kind = "claude_api"
api_key_env = "ANTHROPIC_API_KEY"

# Model per tier (design §5.1). Read by aegis-router.
[models.light]
id = "claude-haiku-5-5"

[models.core]
id = "claude-sonnet-5-5"

[models.expert]
id = "claude-opus-5-5"
effort = "high"

# Lifecycle of one issue (#16). Paths are relative to where `aegis` runs.
[run]
state_dir = ".workspace/state"
pricing = "config/pricing.toml"
step_timeout_s = 1800
# Gate steps in docker/<profile> images, --network none (#5); dependencies
# come from the fetch step behind the egress proxy (#66). To be turned on
# with the first real-model run (#6).
sandbox = false

[budget]
max_cost_usd = 4.0
max_model_calls = 20

# Target repo of the PoC (#2): a clone of the fork, each job gets a worktree.
[repo]
path = ".workspace/repos/scrapy"
language = "python"
base = "master"
key = "scrapy"
# Hidden tests of eval runs (#98): eval/issues lists scrapy's as files.
hidden_test = ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{tests}"]

# scrapy has no uv.lock: the fetch step (#66) installs it and its test
# requirements (#2) into .venv through the egress proxy.
[repo.overrides]
fetch = ["sh", "-c", "uv venv -q --allow-existing .venv && uv pip install -q --python .venv/bin/python -e . attrs coverage pexpect psutil pyftpdlib pygments pytest pytest-cov pytest-rerunfailures pytest-timeout pytest-xdist sybil pytest-twisted"]

# From the measurements of #2: pytest in parallel, the venv's python on PATH.
[repo.overrides.gate]
test = ["python", "-m", "pytest", "-n", "auto", "-p", "no:cacheprovider", "scrapy", "tests", "--doctest-modules"]
test_output = "pytest"

[repo.fork]
owner = "hoanghainh1188"
name = "scrapy"
token_env = "GITHUB_TOKEN"

[identity]
name = "aegis-bot"
email = "aegis-bot@users.noreply.github.com"
